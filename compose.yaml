version: "3.8"
networks:
  arr_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # qBittorrent WebUI
      - 6881:6881 # qBittorrent TCP
      - 6881:6881/udp # qBittorrent UDP
      - 9696:9696 # Prowlarr
      - 7878:7878 # Radarr
      - 8989:8989 # Sonarr
      - 8888:8888 # Gluetun HTTP proxy
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=openvpn
      - OPENVPN_USER=REPLACE_WITH_USER
      - OPENVPN_PASSWORD=REPLACE_PASSWORD
      - SERVER_HOSTNAMES=REPLACE_WITH_URL
      - TZ=America/New_York
      - HTTPPROXY=on
      - SHADOWSOCKS=off
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24,172.20.0.0/16
    volumes:
      - /mnt/crucialssd/gluetun:/gluetun
    networks:
      arr_network:
        ipv4_address: 172.20.0.2
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
      - TZ=REPLACE_WITH_VPN_TIMEZONE
      - BROWSER_TIMEOUT=40000
    networks:
      arr_network:
        ipv4_address: 172.20.0.10
    depends_on:
      - gluetun
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /mnt/crucialssd/qbittorrent/config:/config
      - /mnt/crucialssd/downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/New_York
    volumes:
      - /mnt/crucialssd/prowlarr:/config
    depends_on:
      - gluetun
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: service:gluetun
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/New_York
    volumes:
      - /mnt/crucialssd/radarr:/config
      - /mnt/crucialssd/downloads:/downloads
      - /mnt/crucialssd/filedump/PlexMedia/Movies:/movies
    depends_on:
      - gluetun
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: service:gluetun
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/New_York
    volumes:
      - /mnt/crucialssd/sonarr:/config
      - /mnt/crucialssd/downloads:/downloads
      - /mnt/crucialssd/filedump/PlexMedia/TV:/tv
      - /mnt/crucialssd/filedump/PlexMedia/Anime:/anime
    depends_on:
      - gluetun
    restart: unless-stopped